<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>マイクラ時間に変換するサイト - そえりのへや</title>
    <meta name="keywords" content="マインクラフト,時間変換,マイクラ時間,現実時間">
    <meta name="description" content="マインクラフトのゲーム内時間と現実時間を相互リアルタイム変換できるツールです。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <style>
      .converter-container {
        background: #f9f9f9;
        border: 1px solid #ddd;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 6px;
      }
      .time-section {
        margin-bottom: 15px;
      }
      .time-section h3 {
        font-size: 16px;
        margin: 0 0 10px 0;
        color: #265699;
        border-bottom: 2px solid #C7DBE5;
        padding-bottom: 5px;
      }
      .input-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 15px;
      }
      .input-row input {
        padding: 6px 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 75px;
        text-align: right;
      }
      .sync-icon {
        text-align: center;
        font-size: 18px;
        color: #888;
        margin: 10px 0;
      }
      .help-text {
        font-size: 12px;
        color: #666;
        margin-top: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="outer">
      <header>
        <h1><a href="index.html">そえりのへや</a></h1>
        <p>マイクラ時間に変換するサイト</p>
      </header>
      
      <div id="content">
        <div class="inner">
          <h2>時間相互変換ツール</h2>
          
          <div class="converter-container">
            <!-- 現実の時間 -->
            <div class="time-section">
              <h3>⏱ 現実の時間</h3>
              <div class="input-row">
                <input type="number" id="realMins" value="20" min="0"> 分
                <input type="number" id="realSecs" value="0" min="0" max="59"> 秒
              </div>
            </div>

            <div class="sync-icon">⇅（自動連動）</div>

            <!-- マイクラの時間 -->
            <div class="time-section">
              <h3>⛏ マイクラの時間</h3>
              <div class="input-row">
                <input type="number" id="mcDays" value="1" min="0"> 日
                <input type="number" id="mcHours" value="0" min="0" max="23"> 時間
                <input type="number" id="mcMins" value="0" min="0" max="59"> 分
              </div>
            </div>

            <p class="help-text">
              ※どちらかの数字を変更すると、もう片方がリアルタイムで書き換わります。<br>
              （計算基準：マイクラ1日＝現実20分 / マイクラ1時間＝現実50秒）
            </p>
          </div>
        </div>
      </div>
      
      <aside>
        <div class="right-title">SNS / 外部リンク</div>
        <div class="link">
          <ul>
            <li><a href="https://x.com/soweli_suwi0209" target="_blank" rel="noopener noreferrer">Twitter (現X)</a></li>
          </ul>
        </div>
      </aside>
      
      <footer>
        <p>© 2026 そえりのへや</p>
      </footer>
    </div>

    <script>
      // 各入力欄の取得
      const realMinsInput = document.getElementById('realMins');
      const realSecsInput = document.getElementById('realSecs');

      const mcDaysInput = document.getElementById('mcDays');
      const mcHoursInput = document.getElementById('mcHours');
      const mcMinsInput = document.getElementById('mcMins');

      // 現実の入力値変更 ➔ マイクラの値を更新
      function updateMcFromReal() {
        const mins = parseFloat(realMinsInput.value) || 0;
        const secs = parseFloat(realSecsInput.value) || 0;
        const totalRealSecs = (mins * 60) + secs;

        // マイクラ1時間 ＝ 現実50秒
        const totalMcHours = totalRealSecs / 50;

        let days = Math.floor(totalMcHours / 24);
        let hours = Math.floor(totalMcHours % 24);
        let mcMins = Math.round((totalMcHours % 1) * 60);

        if (mcMins >= 60) {
          mcMins = 0;
          hours += 1;
        }
        if (hours >= 24) {
          hours = 0;
          days += 1;
        }

        mcDaysInput.value = days;
        mcHoursInput.value = hours;
        mcMinsInput.value = mcMins;
      }

      // マイクラの入力値変更 ➔ 現実の値を更新
      function updateRealFromMc() {
        const days = parseFloat(mcDaysInput.value) || 0;
        const hours = parseFloat(mcHoursInput.value) || 0;
        const mcMins = parseFloat(mcMinsInput.value) || 0;

        const totalMcHours = (days * 24) + hours + (mcMins / 60);
        // 現実秒数 ＝ マイクラ合計時間 × 50秒
        const totalRealSecs = totalMcHours * 50;

        let realMins = Math.floor(totalRealSecs / 60);
        let realSecs = Math.round(totalRealSecs % 60);

        if (realSecs >= 60) {
          realSecs = 0;
          realMins += 1;
        }

        realMinsInput.value = realMins;
        realSecsInput.value = realSecs;
      }

      // イベントリスナー登録（入力時に即座に計算）
      [realMinsInput, realSecsInput].forEach(input => {
        input.addEventListener('input', updateMcFromReal);
      });

      [mcDaysInput, mcHoursInput, mcMinsInput].forEach(input => {
        input.addEventListener('input', updateRealFromMc);
      });
    </script>
  </body>
</html>
