<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>マイクラ時間に変換するサイト - そえりのへや</title>
    <meta name="keywords" content="マインクラフト,時間変換,マイクラ時間,現実時間">
    <meta name="description" content="マインクラフトのゲーム内時間と現実時間を相互リアルタイム変換できるツールです。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <style>
      .converter-container {
        background: #f9f9f9;
        border: 1px solid #ddd;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 6px;
      }
      .time-section {
        margin-bottom: 15px;
      }
      .time-section h3 {
        font-size: 16px;
        margin: 0 0 12px 0;
        color: #265699;
        border-bottom: 2px solid #C7DBE5;
        padding-bottom: 5px;
      }
      .input-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .field {
        display: flex;
        align-items: center;
        font-size: 15px;
      }
      .field label {
        width: 65px;
        font-weight: bold;
      }
      .field input {
        padding: 6px 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 130px;
        text-align: right;
        margin-right: 8px;
      }
      .sync-icon {
        text-align: center;
        font-size: 18px;
        color: #888;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <div id="outer">
      <header>
        <h1><a href="index.html">そえりのへや</a></h1>
        <p>マイクラ時間に変換するサイト</p>
      </header>
      
      <div id="content">
        <div class="inner">
          <h2>時間相互変換ツール</h2>
          
          <div class="converter-container">
            <!-- 現実の時間 -->
            <div class="time-section">
              <h3>⏱ 現実の時間</h3>
              <div class="input-grid">
                <div class="field">
                  <label>時間：</label>
                  <input type="number" id="realHours" value="0.33" step="any" min="0"> 時間
                </div>
                <div class="field">
                  <label>分：</label>
                  <input type="number" id="realMins" value="20" step="any" min="0"> 分
                </div>
                <div class="field">
                  <label>秒：</label>
                  <input type="number" id="realSecs" value="1200" step="any" min="0"> 秒
                </div>
              </div>
            </div>

            <div class="sync-icon">⇅</div>

            <!-- マイクラの時間 -->
            <div class="time-section">
              <h3>⛏ マイクラの時間</h3>
              <div class="input-grid">
                <div class="field">
                  <label>日：</label>
                  <input type="number" id="mcDays" value="1" step="any" min="0"> 日
                </div>
                <div class="field">
                  <label>時間：</label>
                  <input type="number" id="mcHours" value="24" step="any" min="0"> 時間
                </div>
                <div class="field">
                  <label>分：</label>
                  <input type="number" id="mcMins" value="1440" step="any" min="0"> 分
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <aside>
        <div class="right-title">SNS / 外部リンク</div>
        <div class="link">
          <ul>
            <li><a href="https://x.com/soweli_suwi0209" target="_blank" rel="noopener noreferrer">Twitter (現X)</a></li>
          </ul>
        </div>
      </aside>
      
      <footer>
        <p>© 2026 そえりのへや</p>
      </footer>
    </div>

    <script>
      const inputs = {
        realHours: document.getElementById('realHours'),
        realMins: document.getElementById('realMins'),
        realSecs: document.getElementById('realSecs'),
        mcDays: document.getElementById('mcDays'),
        mcHours: document.getElementById('mcHours'),
        mcMins: document.getElementById('mcMins')
      };

      function calculateAndUpdate(sourceId) {
        const val = parseFloat(inputs[sourceId].value);
        if (isNaN(val)) return;

        let totalRealSecs = 0;

        // 入力元に基づいて「現実の総秒数」を算出
        switch (sourceId) {
          case 'realHours': totalRealSecs = val * 3600; break;
          case 'realMins':  totalRealSecs = val * 60; break;
          case 'realSecs':  totalRealSecs = val; break;
          case 'mcDays':    totalRealSecs = val * 1200; break; // マイクラ1日 = 20分 = 1200秒
          case 'mcHours':   totalRealSecs = val * 50; break;   // マイクラ1時間 = 50秒
          case 'mcMins':    totalRealSecs = val * (50 / 60); break; // マイクラ1分 = 50/60秒
        }

        // 各単位へ全換算
        const results = {
          realHours: totalRealSecs / 3600,
          realMins:  totalRealSecs / 60,
          realSecs:  totalRealSecs,
          mcDays:    totalRealSecs / 1200,
          mcHours:   totalRealSecs / 50,
          mcMins:    totalRealSecs / (50 / 60)
        };

        // 操作中でない他の全入力欄を更新
        const activeEl = document.activeElement;
        for (const key in inputs) {
          if (key !== sourceId && inputs[key] !== activeEl) {
            const num = results[key];
            // 整数ならそのまま、小数なら小数点以下2桁までに丸める
            inputs[key].value = Number.isInteger(num) ? num : parseFloat(num.toFixed(2));
          }
        }
      }

      // すべての入力欄にイベントリスナーを設定
      Object.keys(inputs).forEach(key => {
        inputs[key].addEventListener('input', () => calculateAndUpdate(key));
      });
    </script>
  </body>
</html>
