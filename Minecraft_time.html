<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>マイクラ時間に変換するサイト - そえりのへや</title>
    <meta name="keywords" content="マインクラフト,時間変換,マイクラ時間,現実時間">
    <meta name="description" content="マインクラフトのゲーム内時間と現実時間を相互リアルタイム変換できるツールです。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <!-- 共通UI読み込み用JS -->
    <script src="include.js" defer></script>
    <style>
      .converter-container {
        background: #f9f9f9;
        border: 1px solid #ddd;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 6px;
      }
      .time-section {
        margin-bottom: 15px;
      }
      .time-section h3 {
        font-size: 16px;
        margin: 0 0 12px 0;
        color: #265699;
        border-bottom: 2px solid #C7DBE5;
        padding-bottom: 5px;
      }
      .input-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .field {
        display: flex;
        align-items: center;
        font-size: 15px;
      }
      .field label {
        width: 70px;
        font-weight: bold;
      }
      .field input {
        padding: 6px 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 140px;
        text-align: right;
        margin-right: 8px;
      }
      .sync-icon {
        text-align: center;
        font-size: 18px;
        color: #888;
        margin: 15px 0;
      }
    </style>
  </head>
  <body>
    <div id="outer">
      <!-- 共通UI：include.jsで自動読み込み -->
      <header></header>
      
      <div id="content">
        <div class="inner">
          <h2>時間相互変換ツール</h2>
          
          <div class="converter-container">
            <!-- 現実の時間 -->
            <div class="time-section">
              <h3>⏱ 現実の時間</h3>
              <div class="input-grid">
                <div class="field">
                  <label>年：</label>
                  <input type="number" id="realYears" step="any" min="0"> 年
                </div>
                <div class="field">
                  <label>日：</label>
                  <input type="number" id="realDays" step="any" min="0"> 日
                </div>
                <div class="field">
                  <label>時間：</label>
                  <input type="number" id="realHours" step="any" min="0"> 時間
                </div>
                <div class="field">
                  <label>分：</label>
                  <input type="number" id="realMins" step="any" min="0"> 分
                </div>
                <div class="field">
                  <label>秒：</label>
                  <input type="number" id="realSecs" step="any" min="0"> 秒
                </div>
              </div>
            </div>

            <div class="sync-icon">⇅</div>

            <!-- マイクラの時間 -->
            <div class="time-section">
              <h3>⛏ マイクラの時間</h3>
              <div class="input-grid">
                <div class="field">
                  <label>年：</label>
                  <input type="number" id="mcYears" step="any" min="0"> 年
                </div>
                <div class="field">
                  <label>日：</label>
                  <input type="number" id="mcDays" value="1" step="any" min="0"> 日
                </div>
                <div class="field">
                  <label>時間：</label>
                  <input type="number" id="mcHours" step="any" min="0"> 時間
                </div>
                <div class="field">
                  <label>分：</label>
                  <input type="number" id="mcMins" step="any" min="0"> 分
                </div>
                <div class="field">
                  <label>秒：</label>
                  <input type="number" id="mcSecs" step="any" min="0"> 秒
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 共通UI：include.jsで自動読み込み -->
      <aside></aside>
      <footer></footer>
    </div>

    <script>
      const inputs = {
        realYears: document.getElementById('realYears'),
        realDays:  document.getElementById('realDays'),
        realHours: document.getElementById('realHours'),
        realMins:  document.getElementById('realMins'),
        realSecs:  document.getElementById('realSecs'),
        mcYears:   document.getElementById('mcYears'),
        mcDays:    document.getElementById('mcDays'),
        mcHours:   document.getElementById('mcHours'),
        mcMins:    document.getElementById('mcMins'),
        mcSecs:    document.getElementById('mcSecs')
      };

      function calculateAndUpdate(sourceId) {
        const val = parseFloat(inputs[sourceId].value);
        if (isNaN(val)) return;

        let totalRealSecs = 0;

        // 入力元の単位から「現実の総秒数」に統一計算
        switch (sourceId) {
          case 'realYears': totalRealSecs = val * 31536000; break; // 365日
          case 'realDays':  totalRealSecs = val * 86400; break;
          case 'realHours': totalRealSecs = val * 3600; break;
          case 'realMins':  totalRealSecs = val * 60; break;
          case 'realSecs':  totalRealSecs = val; break;
          case 'mcYears':   totalRealSecs = val * 438000; break; // 365マイクラ日 = 438,000秒
          case 'mcDays':    totalRealSecs = val * 1200; break;   // 1マイクラ日 = 20分 = 1200秒
          case 'mcHours':   totalRealSecs = val * 50; break;     // 1マイクラ時間 = 50秒
          case 'mcMins':    totalRealSecs = val * (50 / 60); break;
          case 'mcSecs':    totalRealSecs = val * (1 / 72); break; // 1マイクラ秒 = 1/72秒
        }

        // 全単位への算出
        const results = {
          realYears: totalRealSecs / 31536000,
          realDays:  totalRealSecs / 86400,
          realHours: totalRealSecs / 3600,
          realMins:  totalRealSecs / 60,
          realSecs:  totalRealSecs,
          mcYears:   totalRealSecs / 438000,
          mcDays:    totalRealSecs / 1200,
          mcHours:   totalRealSecs / 50,
          mcMins:    totalRealSecs / (50 / 60),
          mcSecs:    totalRealSecs * 72
        };

        // フォーカスされていない他の全入力欄を更新
        const activeEl = document.activeElement;
        for (const key in inputs) {
          if (key !== sourceId && inputs[key] !== activeEl) {
            const num = results[key];
            if (Number.isInteger(num)) {
              inputs[key].value = num;
            } else {
              // 端数が小さすぎる場合は有効数字を残して綺麗に表示
              inputs[key].value = parseFloat(num.toFixed(4));
            }
          }
        }
      }

      // イベントリスナーの登録
      Object.keys(inputs).forEach(key => {
        inputs[key].addEventListener('input', () => calculateAndUpdate(key));
      });

      // 初期表示計算（マイクラ1日＝各単位に自動展開）
      calculateAndUpdate('mcDays');
    </script>
  </body>
</html>
