<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>ヒメミコ顔文字ジェネレーター - そえりのへや</title>
    <meta name="keywords" content="ヒメミコ,顔文字,ジェネレーター,そえりのへや">
    <meta name="description" content="ヒメミコの顔文字を作成・コピーできるツールです。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <style>
      /* --- ジェネレーター専用スタイル --- */
      :root {
        --copy-bg: #F0B0B0;
        --part-active-bg: #B0B0F0;
        --bg-color: #f9f9fb;
        --card-bg: #ffffff;
        --text-color: #333333;
        --border-color: #e0e0e0;
      }

      .generator-container {
        background-color: var(--card-bg);
        border-radius: 8px;
        padding: 20px;
        border: 1px solid #ddd;
        margin-bottom: 20px;
      }

      .preview-box {
        background-color: var(--bg-color);
        border: 2px solid var(--border-color);
        border-radius: 8px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        font-size: 2rem;
        font-family: Arial, sans-serif;
        margin-bottom: 16px;
        word-break: break-all;
        white-space: pre-wrap;
        overflow: hidden;
        line-height: 1;
        color: var(--text-color);
      }

      .copy-btn {
        width: 100%;
        background-color: var(--copy-bg);
        color: #333333;
        border: none;
        border-radius: 6px;
        padding: 12px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
        margin-bottom: 20px;
      }

      .copy-btn:hover {
        opacity: 0.85;
      }

      .copy-btn:active {
        transform: scale(0.98);
      }

      .section-title {
        font-weight: bold;
        margin-top: 16px;
        margin-bottom: 8px;
        font-size: 0.95rem;
        color: #666;
      }

      .part-options {
        display: grid;
        grid-template-columns: repeat( auto-fit, minmax(60px, 1fr) );
        gap: 8px;
        margin-bottom: 8px;
      }

      .part-btn {
        background-color: white;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 0 4px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-family: Arial, sans-serif;
        color: var(--text-color);
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        overflow: hidden;
        line-height: 1;
      }

      .part-btn:hover {
        border-color: var(--part-active-bg);
        background-color: #f0f0ff;
      }

      .part-btn.active {
        background-color: var(--part-active-bg);
        color: #333333;
        border-color: var(--part-active-bg);
        font-weight: bold;
      }

      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background-color: #323232;
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 0.875rem;
        opacity: 0;
        transition: all 0.3s ease;
        pointer-events: none;
        z-index: 1000;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="outer">
      <header>
        <h1><a href="index.html">そえりのへや</a></h1>
        <p>ヒメミコ顔文字ジェネレーター</p>
      </header>
      
      <div id="content">
        <div class="inner">
          <h2>ヒメミコ顔文字ジェネレーター</h2>
          
          <div class="generator-container">
            <!-- プレビュー表示エリア -->
            <div class="preview-box" id="emojiPreview"></div>

            <!-- コピーボタン -->
            <button class="copy-btn" id="copyBtn">クリップボードにコピー</button>

            <!-- 右目の選択エリア -->
            <div class="section-title">右目を選択</div>
            <div class="part-options" id="rightEyeOptions"></div>

            <!-- 左目の選択エリア -->
            <div class="section-title">左目を選択</div>
            <div class="part-options" id="leftEyeOptions"></div>

            <!-- 口の選択エリア -->
            <div class="section-title">口パーツを選択</div>
            <div class="part-options" id="mouthOptions"></div>
          </div>
        </div>
      </div>
      
      <aside>
        <div class="right-title">SNS / 外部リンク</div>
        <div class="link">
          <ul>
            <li><a href="https://x.com/soweli_suwi0209" target="_blank" rel="noopener noreferrer">Twitter (現X)</a></li>
          </ul>
        </div>
      </aside>
      
      <footer>
        <p>© 2026 そえりのへや</p>
      </footer>
    </div>

    <!-- コピー完了通知 -->
    <div class="toast" id="toast">コピーしました！</div>

    <script>
      // 絵文字の固定パーツと可変パーツの設定
      const state = {
        leftEar: '<⸊༼',
        rightEye: '\u11c2', // デフォルト: ᇂ
        hair: '\u207d',     // 髪の毛 (⁽)
        mouth: '\u032b',    // デフォルト: ̫
        leftEye: '\u11c2',  // デフォルト: ᇂ
        rightEar: '༽⸉>'
      };

      // 右目（画面に向かって左側）専用の選択肢
      const rightEyeList = [
        { label: 'ᇂ', value: '\u11c2' },
        { label: 'ᆼ', value: '\u11bc' },
        { label: 'ᆸ', value: '\u11c1' },
        { label: '﹥', value: '\ufe65' },
        { label: '﹣', value: '\ufe63' }
      ];

      // 左目（画面に向かって右側）専用の選択肢
      const leftEyeList = [
        { label: 'ᇂ', value: '\u11c2' },
        { label: 'ᆼ', value: '\u11bc' },
        { label: 'ᆸ', value: '\u11c1' },
        { label: '﹤', value: '\ufe64' },
        { label: '﹣', value: '\ufe63' }
      ];

      // 口の選択肢リスト
      const mouthList = [
        '\u032b', // ̫
        '\u032d', // ̭
        '\u032c', // ̬
        '\u0320', // ̠
        '\u032f', // ̮
        '\u032e', // ̯
        '\u1a6c', // ᩬ
        '\u0330', // ̰
        '\u0325'  // ̥
      ];

      const previewEl = document.getElementById('emojiPreview');
      const rightEyeOptionsEl = document.getElementById('rightEyeOptions');
      const leftEyeOptionsEl = document.getElementById('leftEyeOptions');
      const mouthOptionsEl = document.getElementById('mouthOptions');
      const copyBtn = document.getElementById('copyBtn');
      const toastEl = document.getElementById('toast');

      // プレビューの更新
      function renderEmoji() {
        const fullEmoji = `${state.leftEar}${state.rightEye}${state.hair}${state.mouth}${state.leftEye}${state.rightEar}`;
        previewEl.textContent = fullEmoji;
        return fullEmoji;
      }

      // 目のボタン一覧を生成
      function initEyeOptions(containerEl, eyeKey, optionsList) {
        containerEl.innerHTML = '';
        optionsList.forEach(item => {
          const btn = document.createElement('button');
          btn.className = `part-btn ${item.value === state[eyeKey] ? 'active' : ''}`;
          btn.textContent = item.label;

          btn.addEventListener('click', () => {
            state[eyeKey] = item.value;

            containerEl.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderEmoji();
          });
          containerEl.appendChild(btn);
        });
      }

      // 口のボタン一覧を生成
      function initMouthOptions() {
        mouthOptionsEl.innerHTML = '';
        mouthList.forEach(m => {
          const btn = document.createElement('button');
          btn.className = `part-btn ${m === state.mouth ? 'active' : ''}`;
          btn.textContent = `${state.hair}${m}`;
          
          btn.addEventListener('click', () => {
            state.mouth = m;
            
            document.querySelectorAll('#mouthOptions .part-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderEmoji();
          });
          mouthOptionsEl.appendChild(btn);
        });
      }

      // クリップボードへコピー
      copyBtn.addEventListener('click', async () => {
        const textToCopy = renderEmoji();
        try {
          await navigator.clipboard.writeText(textToCopy);
          showToast();
        } catch (err) {
          const textarea = document.createElement('textarea');
          textarea.value = textToCopy;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          showToast();
        }
      });

      // トースト通知の表示
      function showToast() {
        toastEl.classList.add('show');
        setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2000);
      }

      // 初期化実行
      renderEmoji();
      initEyeOptions(rightEyeOptionsEl, 'rightEye', rightEyeList);
      initEyeOptions(leftEyeOptionsEl, 'leftEye', leftEyeList);
      initMouthOptions();
    </script>
  </body>
</html>
